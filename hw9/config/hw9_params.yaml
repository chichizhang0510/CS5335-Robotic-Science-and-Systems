# HW9 parameters, shared by cone_hunter and cone_calib. Run from the hw9 folder:
#   ros2 run hw9pkg cone_calib  --ros-args --params-file config/hw9_params.yaml
#   ros2 run hw9pkg cone_hunter --ros-args --params-file config/hw9_params.yaml
# Edit and re-run; no rebuild is needed. Write decimals with a point (0.30, not .3).
/**:
  ros__parameters:
    # The three cone colours (Task 1 hard-codes these names). Each one needs
    # an hsv entry below.
    colors: [red, yellow, green]

    # HSV boxes in OpenCV units (H 0-179, S 0-255, V 0-255):
    #   [h_lo, h_hi, s_lo, s_hi, v_lo, v_hi]   (add 6 more numbers for a second box)
    # h_lo > h_hi wraps through 0, for red. Measure your cones with cone_calib.
    hsv:
      red:    [168, 4, 184, 255, 136, 255]   # measured: centre patch H=176 S=254 V=226
      orange: [7, 20, 140, 255, 110, 255]
      yellow: [19, 34, 95, 255, 150, 255]    # measured: centre patch H=27 S=165 V=244
      green:  [41, 57, 59, 255, 132, 255]   # measured: centre patch H=49 S=129 V=222
      blue:   [95, 125, 120, 255, 40, 255]
      purple: [126, 150, 60, 255, 40, 255]
      pink:   [151, 169, 60, 255, 100, 255]

    # Camera. The 250x250 preview is a centre crop of the OAK-D's 69 deg view,
    # about 42 deg wide. Use 69.0 if a round object looks squashed in the preview.
    image_topic: /oakd/rgb/preview/image_raw
    camera_hfov_deg: 42.0

    # Task 2 stopping distance. The robot stops when the lidar range to the cone
    # is contact_range + target_gap. CALIBRATE contact_range (see README):
    # it is the lidar range cone_calib prints while the bumper just touches a cone.
    contact_range: 0.28
    target_gap: 0.025

    # Task 1 turn speed (rad/s), lowered automatically if the camera is slow.
    scan_speed: 0.30
    # Task 2 speeds.
    max_speed: 0.15
    min_speed: 0.025
    # Reverse this far from a cone before turning to the next one (0.0 = off).
    backoff_distance: 0.08

    output_dir: hw9_output
